name: CodeQL

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read

jobs:
  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          queries: security-extended
      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:python
          output: ${{ runner.temp }}/codeql-results
      - name: Require a clean security scan
        env:
          ABDA_CODEQL_SARIF: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["ABDA_CODEQL_SARIF"])
          reports = sorted(root.rglob("*.sarif"))
          if not reports:
              raise SystemExit("CodeQL did not produce a SARIF report")
          findings = 0
          for report in reports:
              data = json.loads(report.read_text(encoding="utf-8"))
              findings += sum(len(run.get("results") or []) for run in data["runs"])
          if findings:
              raise SystemExit(f"CodeQL reported {findings} security finding(s)")
          print("CodeQL security findings: 0")
          PY
