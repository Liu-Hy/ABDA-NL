name: Publish service image

on:
  push:
    tags:
      - service-image-*

permissions:
  contents: read

concurrency:
  group: service-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-publish-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ABDA_CI_TRIVY_VERSION: 0.74.0
      ABDA_CI_TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a cleared engine source license gate
        run: |
          set -Eeuo pipefail
          if ! grep --fixed-strings --line-regexp --quiet \
            'Public image publication gate: cleared' \
            docs/operations/source-license-review.md; then
            echo 'Public image publication is blocked by the engine source license review.' >&2
            exit 1
          fi
      - name: Select the owner-scoped image repository
        id: registry
        shell: bash
        run: |
          set -Eeuo pipefail
          ABDA_IMAGE_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          ABDA_IMAGE_NAME="ghcr.io/${ABDA_IMAGE_OWNER}/abda-nl"
          printf 'name=%s\n' "$ABDA_IMAGE_NAME" >>"$GITHUB_OUTPUT"
          printf 'ABDA_IMAGE_NAME=%s\n' "$ABDA_IMAGE_NAME" >>"$GITHUB_ENV"
      - name: Identify the immutable source revision
        id: source
        run: |
          set -Eeuo pipefail
          ABDA_IMAGE_COMMIT="$(git rev-parse --verify HEAD)"
          test "$(printf '%s' "$ABDA_IMAGE_COMMIT" | wc -c)" -eq 40
          printf 'commit=%s\n' "$ABDA_IMAGE_COMMIT" >>"$GITHUB_OUTPUT"
          printf 'tag=%s:sha-%s\n' \
            "$ABDA_IMAGE_NAME" "$ABDA_IMAGE_COMMIT" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install the hash-locked verification environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify source, dependencies, and tests
        run: |
          set -Eeuo pipefail
          python -m ruff check app migrations tests
          python -m ruff check --select S app
          python -m pip_audit \
            --disable-pip --require-hashes \
            --requirement requirements.runtime.lock
          python -m pip_audit \
            --disable-pip --require-hashes \
            --requirement requirements.lock
          python -m pytest -q
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to replace an existing commit image
        env:
          ABDA_IMAGE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          set -Eeuo pipefail
          if docker manifest inspect "$ABDA_IMAGE_TAG" >/dev/null 2>&1; then
            echo "The immutable image tag already exists: $ABDA_IMAGE_TAG" >&2
            exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build and push the commit image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          build-args: |
            ABDA_IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            ABDA_IMAGE_REVISION=${{ steps.source.outputs.commit }}
          context: .
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.licenses=GPL-3.0-only
          platforms: linux/amd64
          provenance: false
          pull: true
          push: true
          sbom: false
          tags: ${{ steps.source.outputs.tag }}
      - name: Smoke test the exact pushed digest
        env:
          ABDA_IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -Eeuo pipefail
          case "$ABDA_IMAGE_DIGEST" in
            sha256:????????????????????????????????????????????????????????????????)
              ;;
            *)
              echo "Unexpected registry digest: $ABDA_IMAGE_DIGEST" >&2
              exit 1
              ;;
          esac

          ABDA_IMAGE_URI="${ABDA_IMAGE_NAME}@${ABDA_IMAGE_DIGEST}"
          ABDA_IMAGE_CONTAINER_ID="$(
            docker run --detach --pull always \
              --publish 127.0.0.1:18000:8000 \
              "$ABDA_IMAGE_URI" \
              /opt/venv/bin/python -m app.cli.serve \
              --host 0.0.0.0 --port 8000 --no-browser \
              --allow-non-loopback --basic
          )"
          cleanup() {
            ABDA_IMAGE_EXIT_CODE=$?
            if [ "$ABDA_IMAGE_EXIT_CODE" -ne 0 ]; then
              docker logs "$ABDA_IMAGE_CONTAINER_ID"
            fi
            docker rm --force "$ABDA_IMAGE_CONTAINER_ID" >/dev/null
            exit "$ABDA_IMAGE_EXIT_CODE"
          }
          trap cleanup EXIT

          ABDA_IMAGE_READY=0
          for ABDA_IMAGE_ATTEMPT in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18000/health/ready >/dev/null; then
              ABDA_IMAGE_READY=1
              break
            fi
            sleep 1
          done
          test "$ABDA_IMAGE_READY" -eq 1
          test -s LICENSE
          docker exec "$ABDA_IMAGE_CONTAINER_ID" \
            cat /srv/abda/LICENSE | cmp --silent LICENSE -
          for ABDA_NOTICE in THIRD_PARTY_NOTICES.md LICENSES/ABDA-NL-MIT.txt; do
            docker exec "$ABDA_IMAGE_CONTAINER_ID" \
              cat "/srv/abda/$ABDA_NOTICE" | cmp --silent "$ABDA_NOTICE" -
          done
          docker exec "$ABDA_IMAGE_CONTAINER_ID" \
            /opt/venv/bin/python -c \
            'import importlib.util; assert importlib.util.find_spec("pip") is None'
          docker exec "$ABDA_IMAGE_CONTAINER_ID" \
            python -c \
            'import importlib.util; assert importlib.util.find_spec("pip") is None'
          curl --fail --silent --show-error \
            http://127.0.0.1:18000/health/live >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:18000/config >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:18000/privacy.html >/dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:18000/terms.html >/dev/null
      - name: Scan the exact pushed digest and generate its SBOM
        env:
          ABDA_IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -Eeuo pipefail
          ABDA_IMAGE_URI="${ABDA_IMAGE_NAME}@${ABDA_IMAGE_DIGEST}"
          ABDA_CI_SECURITY_DIR="artifacts/container-security"
          mkdir -p "$ABDA_CI_SECURITY_DIR"
          curl --fail --silent --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${ABDA_CI_TRIVY_VERSION}/trivy_${ABDA_CI_TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "${ABDA_CI_TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | \
            sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          chmod 0755 "$RUNNER_TEMP/trivy"

          "$RUNNER_TEMP/trivy" image --quiet --timeout 5m \
            --scanners vuln \
            --skip-files '**/pip/_vendor/bom.cdx.json' \
            --format json \
            --output "$ABDA_CI_SECURITY_DIR/vulnerabilities.json" \
            "$ABDA_IMAGE_URI"
          "$RUNNER_TEMP/trivy" image --quiet --timeout 5m \
            --scanners secret \
            --format json \
            --output "$RUNNER_TEMP/container-secrets.json" \
            "$ABDA_IMAGE_URI"
          "$RUNNER_TEMP/trivy" config --quiet \
            --format json \
            --output "$ABDA_CI_SECURITY_DIR/dockerfile-misconfigurations.json" \
            Dockerfile
          "$RUNNER_TEMP/trivy" image --quiet --timeout 5m \
            --scanners vuln \
            --skip-files '**/pip/_vendor/bom.cdx.json' \
            --format cyclonedx \
            --output "$ABDA_CI_SECURITY_DIR/sbom.cdx.json" \
            "$ABDA_IMAGE_URI"

          set +e
          python deploy/container_security_policy.py \
            "$ABDA_CI_SECURITY_DIR/vulnerabilities.json" \
            --secret-report "$RUNNER_TEMP/container-secrets.json" \
            --misconfiguration-report \
              "$ABDA_CI_SECURITY_DIR/dockerfile-misconfigurations.json" \
            --unfixed-baseline deploy/container_vulnerability_baseline.json | \
            tee "$ABDA_CI_SECURITY_DIR/policy-summary.txt"
          ABDA_CI_POLICY_EXIT=${PIPESTATUS[0]}
          set -e
          {
            echo '## Container security policy'
            echo
            echo '```text'
            cat "$ABDA_CI_SECURITY_DIR/policy-summary.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$ABDA_CI_POLICY_EXIT"
      - name: Preserve release container security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-security-release-${{ steps.source.outputs.commit }}
          path: artifacts/container-security
          if-no-files-found: warn
          retention-days: 14
      - name: Attest the pushed image
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.registry.outputs.name }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Record the deployable digest
        env:
          ABDA_IMAGE_COMMIT: ${{ steps.source.outputs.commit }}
          ABDA_IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          ABDA_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          {
            echo '## Verified service image'
            echo
            echo "Git commit: \`$ABDA_IMAGE_COMMIT\`"
            echo
            echo 'License: GPL-3.0-only; original component notices retained.'
            echo
            echo "Corresponding source: https://github.com/${GITHUB_REPOSITORY}/tree/${ABDA_IMAGE_COMMIT}"
            echo
            echo "Source archive: https://github.com/${GITHUB_REPOSITORY}/archive/${ABDA_IMAGE_COMMIT}.tar.gz"
            echo
            echo "Deploy exactly: \`$ABDA_IMAGE_NAME@$ABDA_IMAGE_DIGEST\`"
            echo
            echo "Attestation: $ABDA_ATTESTATION_URL"
          } >>"$GITHUB_STEP_SUMMARY"
