profiles:
  economy:
    display_name: Economy
    description: Lowest funded cost, pending ABDA quality acceptance.
    public_ready: false
    primary_route: cloudbank-gpt-5.4-mini
    fallback_route: openrouter-gemini-3.7-flash
  balanced:
    display_name: Balanced
    description: Validated baseline for interactive explanations and edits.
    public_ready: true
    primary_route: cloudbank-claude-sonnet-4-6
    fallback_route: openrouter-gemini-3.7-flash
  quality:
    display_name: Quality
    description: Higher reasoning budget for difficult authoring requests.
    public_ready: false
    primary_route: cloudbank-gpt-5.5
    fallback_route: openrouter-gpt-5.6-terra

routes:
  cloudbank-claude-sonnet-4-6:
    adapter: anthropic
    provider: azure-foundry
    billing_source: cloudbank
    model: claude-sonnet-4-6
    model_env: ANTHROPIC_FOUNDRY_CLAUDE_SONNET_4_6_MODEL
  cloudbank-claude-sonnet-5:
    adapter: anthropic
    provider: azure-foundry
    billing_source: cloudbank
    model: claude-sonnet-5
    model_env: ANTHROPIC_FOUNDRY_CLAUDE_SONNET_5_MODEL
  cloudbank-gpt-5.4-mini:
    adapter: openai-responses
    provider: azure-foundry
    billing_source: cloudbank
    model: gpt-5.4-mini
    model_env: AZURE_OPENAI_GPT_5_4_MINI_DEPLOYMENT
  cloudbank-gpt-5.5:
