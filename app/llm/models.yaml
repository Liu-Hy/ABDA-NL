version: 3
updated: "2026-08-17"

# Model prices are current public direct-provider reference prices in USD per
# million tokens as of the catalog date.
# OpenRouter routes carry conservative cost ceilings, then settle from the
# exact cost returned in each response. CloudBank billing remains governed by
# the Azure subscription.
