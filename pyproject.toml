[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abda-nl"
version = "0.2.0"
description = "Natural-language scenario exploration for assumption-based defeasible argumentation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "alembic>=1.16,<2",
  "anthropic>=0.121,<1",
  "authlib>=1.6,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jsonschema>=4.25,<5",
  "matplotlib>=3.9,<4",
  "mcp>=2,<3",
  "networkx>=3.2,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typing-extensions>=4.12,<5",
  "uvicorn>=0.39,<1"
]

[project.optional-dependencies]
dev = [
  "axe-playwright-python>=0.1.8,<0.2",
  "pip-audit>=2.10.1,<3",
  "pip-tools>=7.5,<8",
  "playwright>=1.62,<1.63",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1"
]

[project.scripts]
abda-nl = "app.cli.serve:main"
abda-nl-eval = "app.evals.llm_eval:main"
abda-nl-release-check = "app.cli.release_check:main"

[tool.setuptools.packages.find]
include = ["app*", "examples*", "migrations*"]

[tool.setuptools.package-data]
app = [
  "llm/*.yaml",
  "prompts/*.md",
  "schemas/*.json",
  "static/*",
  "static/vendor/*"
]
examples = [
  "*/*.yaml",
  "*/corpus/*.pdf",
  "*/corpus/*.txt"
]
migrations = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  "app/abda",
  "tests/ConclusionWarrantedTests.py",
  "tests/GroundedDiscussionGameTests.py",
  "tests/GroundedExtensionTests.py",
  "tests/MinMaxNumberingTests.py"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E402", "E501", "B904"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
