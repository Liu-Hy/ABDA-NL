[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abda-nl"
version = "0.2.0"
description = "Natural-language scenario exploration for argument-based reasoning"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "anthropic>=0.121,<1",
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.25,<5",
  "matplotlib>=3.9,<4",
  "networkx>=3.2,<4",
  "pydantic>=2.13,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "typing-extensions>=4.12,<5",
  "uvicorn>=0.39,<1"
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1"
]
browser = [
  "playwright>=1.54,<2"
]

[project.urls]
Homepage = "https://github.com/idaks/ABDA-NL"
Repository = "https://github.com/idaks/ABDA-NL"
Issues = "https://github.com/idaks/ABDA-NL/issues"

[project.scripts]
abda-nl = "app.cli.serve:main"

[tool.setuptools.packages.find]
include = ["app*", "examples*"]

[tool.setuptools.package-data]
app = [
  "prompts/*.md",
  "schemas/*.json",
  "static/*",
  "static/vendor/*"
]
examples = [
  "*/*.yaml",
  "*/corpus/*.pdf",
  "*/corpus/*.txt"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  "app/abda",
  "tests/ConclusionWarrantedTests.py",
  "tests/GroundedDiscussionGameTests.py",
  "tests/GroundedExtensionTests.py",
  "tests/MinMaxNumberingTests.py"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E402", "E501", "B904"]
